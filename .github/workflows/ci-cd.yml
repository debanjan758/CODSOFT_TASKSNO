name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          test -f Task-4-CI-CD-GitHub-Actions/index.html
          echo "index.html found successfully"

      - name: Display deployment message
        run: |
          echo "CI/CD pipeline completed successfully"
          echo "Application is ready for deployment"
